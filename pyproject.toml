[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-harness"
version = "0.1.0"
description = "Policy-as-code for authority and controls in multi-agent systems"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "socragpt"}
]
keywords = ["ai-agents", "agent-governance", "policy-as-code", "multi-agent-systems", "grc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
agent-governance = "agent_governance.cli:entrypoint"

[project.urls]
Repository = "https://github.com/socragpt/agent-governance-harness"
Issues = "https://github.com/socragpt/agent-governance-harness/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_governance*", "utils*"]

[tool.setuptools.package-data]
agent_governance = ["SystemPrompt.xml"]

[tool.unittest]
start-directory = "tests"
